name: EAS Update + Android Auto Submit

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'providers/**'
      - 'i18n/**'
      - 'types/**'
      - 'constants/**'
      - 'utils/**'
      - 'assets/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive

  playstore_submit_android:
    name: Build + Submit Android (Play internal track)
    runs-on: ubuntu-latest
    needs: update
    if: needs.update.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Write Google Play service account key
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}' > ./google-play-service-account.json
      - run: eas build --platform android --profile production --auto-submit --auto-submit-with-profile playstoreProduction --non-interactive
