name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    name: Generate Changelog & Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}

  build-android:
    name: Build Android APK
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk momir-basic-${{ needs.changelog.outputs.tag }}-android.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          files: momir-basic-${{ needs.changelog.outputs.tag }}-android.apk

  build-ios:
    name: Build iOS via EAS
    needs: changelog
    runs-on: ubuntu-latest
    if: ${{ vars.EXPO_TOKEN != '' || secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS with EAS
        run: |
          eas build --platform ios --profile production --non-interactive --wait
          eas build:list --platform ios --status finished --limit 1 --json | \
            bun -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); \
            if(d[0]?.artifacts?.buildUrl) { \
              console.log(d[0].artifacts.buildUrl); \
              require('fs').writeFileSync('ios_url.txt', d[0].artifacts.buildUrl); \
            }"

      - name: Download IPA
        run: |
          if [ -f ios_url.txt ]; then
            curl -L -o momir-basic-${{ needs.changelog.outputs.tag }}-ios.ipa "$(cat ios_url.txt)"
          fi

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        if: hashFiles('momir-basic-*-ios.ipa') != ''
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          files: momir-basic-${{ needs.changelog.outputs.tag }}-ios.ipa
